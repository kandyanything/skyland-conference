name: Rebuild Skyland Conference schedule

# A FULL rebuild re-fetches every school from source, so it is self-correcting:
# it can never erode existing games the way the incremental "next few days"
# splice could. It runs every 3 hours (this is a public repo, so Actions minutes
# are unlimited), which means schedule changes - new games, reschedules,
# cancellations - show up within a few hours, and the 2am slot is simply one of
# these runs. The sanity check refuses to publish a build that came back
# suspiciously thin (a flaky source), so a bad run just waits for the next one.
on:
  schedule:
    # 0,3,6,9,12,21 UTC is the off-window three-hourly cadence. 15-19 UTC
    # covers 11am-3pm ET as a FALLBACK only: the Cloudflare Worker
    # (conference-refresh-trigger, in worker/) is what actually drives that
    # window, because GitHub drops roughly half of these slots and the ones
    # it honours can drift 20-45 minutes.
    - cron: '0 0,3,6,9,12,15,16,17,18,19,21 * * *'
  workflow_dispatch:         # and on demand

concurrency:
  group: schedule-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # keep the committed version so the guard can compare against it
      - name: Snapshot the current schedule
        run: cp data/schedule.json /tmp/previous-schedule.json || echo "no previous build"

      - name: Fetch every school
        run: node scripts/build-schedule.js

      # A build can succeed while returning far too little, if a source changes
      # shape or fails. Fail here rather than publishing a gutted calendar - the
      # next run three hours later will try again.
      - name: Sanity check
        run: node scripts/check-schedule.js /tmp/previous-schedule.json

      - name: Split into per-month files
        run: |
          node scripts/split-schedule.js
          node scripts/build-feeds.js

      - name: Build news feed
        continue-on-error: true
        run: node scripts/build-news.js

      # Vision only needs refreshing weekly, but a weekly cron is a poor way to
      # get that: GitHub drops roughly half of all scheduled slots, so a Sunday-only
      # job would miss most Sundays. This rides the three-hourly run and decides for
      # itself, so a Sunday lost to GitHub heals on the next run rather than waiting
      # another week.
      - name: Refresh Vision videos (weekly, Sundays)
        continue-on-error: true
        run: |
          DO=$(node -e "
            try {
              const j = require('./data/videos.json');
              const g = j.generated ? Date.parse(j.generated) : 0;
              const days = (Date.now() - g) / 86400000;
              const sunday = new Date().getUTCDay() === 0;
              console.log((!g || days >= 7 || (sunday && days >= 1)) ? 'yes' : 'no');
            } catch (e) { console.log('yes'); }
          ")
          if [ "$DO" = "yes" ]; then
            node scripts/build-nfhs-videos.js --weeks 6 --max 60
          else
            echo "videos.json is current - skipping the Vision refresh"
          fi
      - name: Commit if anything changed
        run: |
          git config user.name  "skyland-schedule-bot"
          git config user.email "actions@github.com"
          git add data/schedule.json data/schedule/ feeds data/news.json data/videos.json
          if git diff --cached --quiet; then
            echo "no change - nothing to publish"
            exit 0
          fi
          GAMES=$(node -e "console.log(require('./data/schedule.json').counts.deduped)")
          DATES=$(node -e "console.log(require('./data/schedule.json').counts.dates)")
          git commit -m "Schedule rebuild: ${GAMES} games across ${DATES} dates"
          # A rebuild takes 20+ minutes. Anything else landing on main in that
          # window makes this push non-fast-forward, and a naked `git push`
          # would throw away a build that already fetched, validated and
          # committed cleanly. Rebase onto what landed and try again.
          # -X theirs keeps this build on conflict: it was just rebuilt from
          # source, so it is strictly newer than whatever it lands on.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected - rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort || true; }
          done
          echo "could not push after 3 attempts"
          exit 1
