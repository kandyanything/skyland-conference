var imgs=SRC.map(function(s){var i=new Image();i.src=s;return i;});
function loaded(){for(var i=0;i<imgs.length;i++)if(!imgs[i].complete||!imgs[i].naturalWidth)return false;return true;}

var C=document.getElementById("c"),ctx=C.getContext("2d");
var W=640,H=440,CX=W/2,CY=H*0.37,R=Math.min(W,H)*0.185;
C.width=W;C.height=H;

var PINK="#E0006A",PINK2="#FF5AAD",PINK3="#FFB2D8",NAVY="#07080e",CREAM="#FDF4F8";

// ── easing ──────────────────────────────────────────────────────────────
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rn(now,s,e){return clamp((now-s)/(e-s),0,1);}
function eo2(t){return 1-(1-t)*(1-t);}
function eo3(t){return 1-Math.pow(1-t,3);}
function ei2(t){return t*t;}
// spring for ball squash-settle
function ballSpring(t){
  if(t<=0)return 0;if(t>=1)return 1;
  return 1-Math.cos(t*Math.PI*3.4)*Math.exp(-t*5.0)*(1-t*0.75);
}

// ── pre-computed drip geometry (seeded) ─────────────────────────────────
// Each drip hangs STRAIGHT DOWN from its anchor on the ball surface.
// Positions are in the bottom 60% of the ball (angles ~π/4 to ~3π/4 from right).
var DRIP_DATA = (function(){
  function rnd(s){var seed=s;return function(){seed=(seed*1664525+1013904223)&0xffffffff;return(seed>>>0)/0xffffffff;};}
  var r=rnd(0xD197BBE7|0);
  // 7 drips; angles relative to 6-o'clock (π/2 in canvas = straight down)
  var angles=[-0.50,-0.38,-0.28,-0.62,-0.45,-0.55,-0.33]; // top of ball // multiples of π; 0.5π = straight down
  return angles.map(function(af,i){
    var angle=af*Math.PI;
    return{
      a:angle,                       // angle on ball circle
      ax:Math.cos(angle),ay:Math.sin(angle),  // unit vector
      maxLen:R*(3.4+r()*1.3),        // long drips toward screen bottom
      halfW:R*(0.048+r()*0.055),     // half-width at anchor
      startMs:1750+i*175,            // staggered start times
      growMs:1050+r()*500,           // how long to reach full length
      dropsAt:r()*0.55+0.72          // fraction of growth when a drop forms
    };
  });
})();

// offscreen for glow blur
var offC=document.createElement("canvas");offC.width=W;offC.height=H;
var off=offC.getContext("2d");

// ── draw one pendant drip ────────────────────────────────────────────────
// A pendant drop: wide at the anchor, cylindrical body, teardrop tip.
// Drip always hangs STRAIGHT DOWN (gravity), regardless of anchor angle.
function drawDrip(anchor_ax,anchor_ay,len,hw,alpha){
  if(len<1||alpha<=0)return;
  var tipR=Math.max(2.5,hw*0.55);
  var bodyLen=Math.max(0,len-tipR*1.1);
  var tx=anchor_ax, ty=anchor_ay; // drip falls from anchor straight down

  // gradient: deep at anchor, hot-pink at tip (wet, fresh paint pools at bottom)
  var g=ctx.createLinearGradient(tx,ty,tx,ty+len);
  g.addColorStop(0,"rgba(190,0,72,"+alpha+")");
  g.addColorStop(0.5,"rgba(220,0,95,"+alpha+")");
  g.addColorStop(1,"rgba(255,90,168,"+(alpha*0.88)+")");

  ctx.beginPath();
  // left anchor side
  ctx.moveTo(tx-hw, ty);
  // left bezier: body stays wide then tapers sharply
  ctx.bezierCurveTo(
    tx-hw,    ty+bodyLen*0.45,
    tx-tipR*1.1, ty+bodyLen*0.88,
    tx-tipR, ty+bodyLen
  );
  // teardrop bottom (arc through south pole of tip circle)
  ctx.arc(tx, ty+bodyLen, tipR, Math.PI, 0, false);
  // right bezier: mirror back up
  ctx.bezierCurveTo(
    tx+tipR*1.1, ty+bodyLen*0.88,
    tx+hw,    ty+bodyLen*0.45,
    tx+hw, ty
  );
  // top cap: arc through north (connects back to start)
  ctx.arc(tx, ty, hw, 0, Math.PI, true);
  ctx.closePath();

  ctx.fillStyle=g;
  ctx.fill();

  // wet-paint sheen (specular highlight on left face)
  ctx.save();
  ctx.clip(); // clip to the drip shape we just traced (re-trace or use save trick below)
  // Re-trace for clip
  ctx.restore();
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tx-hw,ty);
  ctx.bezierCurveTo(tx-hw,ty+bodyLen*0.45,tx-tipR*1.1,ty+bodyLen*0.88,tx-tipR,ty+bodyLen);
  ctx.arc(tx,ty+bodyLen,tipR,Math.PI,0,false);
  ctx.bezierCurveTo(tx+tipR*1.1,ty+bodyLen*0.88,tx+hw,ty+bodyLen*0.45,tx+hw,ty);
  ctx.arc(tx,ty,hw,0,Math.PI,true);
  ctx.closePath();
  ctx.clip();
  ctx.globalCompositeOperation="screen";
  var sh=ctx.createLinearGradient(tx-hw,ty,tx-hw*0.1,ty+len*0.6);
  sh.addColorStop(0,"rgba(255,255,255,"+(0.38*alpha)+")");
  sh.addColorStop(0.6,"rgba(255,255,255,"+(0.08*alpha)+")");
  sh.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=sh;
  ctx.fillRect(tx-hw,ty,hw*0.8,len);
  ctx.restore();
}

// ── draw ball ────────────────────────────────────────────────────────────
function drawBall(idx,sy){
  var im=imgs[idx];
  if(!im||!im.complete||!im.naturalWidth)return;
  ctx.save();
  ctx.translate(CX,CY);ctx.scale(1,sy);ctx.translate(-CX,-CY);
  // ground shadow
  ctx.save();ctx.globalAlpha=0.25;
  try{ctx.filter="blur(7px)";}catch(e){}
  ctx.fillStyle="#000";
  ctx.beginPath();ctx.ellipse(CX,CY+R*1.05,R*0.76,R*0.16,0,0,Math.PI*2);ctx.fill();
  ctx.filter="none";ctx.restore();
  // ball image
  var s=2.18*R;
  ctx.drawImage(im,CX-s/2,CY-s/2,s,s);
  ctx.restore();
}

// ── draw pink ball coating (builds as drips form) ────────────────────────
function drawCoating(alpha){
  if(alpha<=0)return;
  ctx.save();
  ctx.beginPath();ctx.arc(CX,CY,R*1.02,0,Math.PI*2);ctx.clip();
  var g=ctx.createLinearGradient(CX,CY-R,CX,CY+R);
  g.addColorStop(0,"rgba(255,100,175,"+(alpha*0.82)+")");
  g.addColorStop(0.30,"rgba(232,0,106,"+(alpha*0.68)+")");
  g.addColorStop(0.70,"rgba(190,0,75,"+(alpha*0.28)+")");
  g.addColorStop(1,"rgba(130,0,48,"+(alpha*0.06)+")");
  ctx.fillStyle=g;ctx.fillRect(CX-R*1.1,CY-R*1.1,R*2.2,R*2.2);
  ctx.restore();
}

// ── draw connecting paint puddle at drip anchors ─────────────────────────
function drawAnchorPool(ax,ay,hw,alpha){
  if(alpha<=0)return;
  ctx.save();
  var g=ctx.createRadialGradient(ax,ay,0,ax,ay,hw*2.2);
  g.addColorStop(0,"rgba(220,0,95,"+alpha+")");
  g.addColorStop(1,"rgba(220,0,95,0)");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(ax,ay,hw*2.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ── ribbon ───────────────────────────────────────────────────────────────
function drawRibbon(cx,cy,sz,a){
  if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;ctx.translate(cx,cy);
  var lw=sz*0.28;ctx.lineWidth=lw;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=PINK2;
  ctx.beginPath();ctx.moveTo(0,sz*0.12);
  ctx.bezierCurveTo(-sz*0.12,-sz*0.20,-sz*1.05,-sz*0.24,-sz*0.70,-sz*0.90);
  ctx.bezierCurveTo(-sz*0.44,-sz*1.32,sz*0.22,-sz*0.74,0,sz*0.12);
  ctx.fillStyle="rgba(255,90,173,0.15)";ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,sz*0.12);
  ctx.bezierCurveTo(sz*0.12,-sz*0.20,sz*1.05,-sz*0.24,sz*0.70,-sz*0.90);
  ctx.bezierCurveTo(sz*0.44,-sz*1.32,-sz*0.22,-sz*0.74,0,sz*0.12);
  ctx.fill();ctx.stroke();
  ctx.lineWidth=lw*0.60;
  ctx.beginPath();ctx.moveTo(-sz*0.06,sz*0.12);ctx.bezierCurveTo(-sz*0.28,sz*0.48,-sz*0.44,sz*0.72,-sz*0.32,sz*1.04);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sz*0.06,sz*0.12);ctx.bezierCurveTo(sz*0.28,sz*0.48,sz*0.44,sz*0.72,sz*0.32,sz*1.04);ctx.stroke();
  ctx.restore();
}

// ── payoff text ───────────────────────────────────────────────────────────
function drawFinalScreen(alpha){
  if(alpha<=0)return;
  var HH=H/2;
  ctx.save();
  ctx.fillStyle="rgba(7,8,14,"+Math.min(1,alpha*1.8).toFixed(3)+")";
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=alpha;
  ctx.textAlign="center";
  var bloom=ctx.createRadialGradient(W/2,HH,0,W/2,HH,W*0.65);
  bloom.addColorStop(0,"rgba(224,0,106,0.50)");
  bloom.addColorStop(0.45,"rgba(180,0,82,0.12)");
  bloom.addColorStop(1,"rgba(224,0,106,0)");
  ctx.fillStyle=bloom;ctx.fillRect(0,0,W,H);
  drawRibbon(W/2-208,HH-14,24,alpha*0.90);
  drawRibbon(W/2+208,HH-14,24,alpha*0.90);
  ctx.save();ctx.globalAlpha=alpha*0.45;ctx.strokeStyle=PINK2;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(W/2-318,HH-70);ctx.lineTo(W/2+318,HH-70);ctx.stroke();
  ctx.restore();
  ctx.shadowColor=PINK;ctx.shadowBlur=65;
  ctx.font="900 112px \"Barlow Condensed\",\"Arial Narrow\",Arial,sans-serif";
  ctx.fillStyle=CREAM;
  ctx.fillText("PINK OCTOBER",W/2,HH+14);
  ctx.shadowBlur=0;ctx.fillText("PINK OCTOBER",W/2,HH+14);
  ctx.save();
  ctx.globalAlpha=alpha*0.80;
  ctx.font="700 14.5px \"Barlow Condensed\",sans-serif";
  try{ctx.letterSpacing="0.20em";}catch(e){}
  ctx.fillStyle=PINK2;
  ctx.fillText("BREAST CANCER AWARENESS MONTH",W/2,HH+58);
  try{ctx.letterSpacing="0em";}catch(e){}
  ctx.restore();
  ctx.save();ctx.globalAlpha=alpha*0.32;ctx.strokeStyle=PINK2;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W/2-268,HH+76);ctx.lineTo(W/2+268,HH+76);ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// ── TIMELINE ─────────────────────────────────────────────────────────────
// Ball 0 (basketball):  0 – 380ms show,  380–560ms flip
// Ball 1 (soccer):    560 – 940ms show,  940-1120ms flip
// Ball 2 (volleyball):1120ms IN (hero) — holds for ~3.2s while drips form
//   squash-settle:    1120-1320ms
//   drip phase:       1680 – 4600ms
//   coating builds:   1680 – 3400ms
// Text:               4000ms
// Hold:               4000 – 5400ms
// Fade:               5400 – 6100ms
var SHOW0=380,FLIP=180;
var B0=SHOW0+FLIP;                   // 560
var B1=B0+380+FLIP;                  // 1120  (soccer shows 380ms)
var B2=B1;                           // 1120 — hero ball arrives here
var SETTLE_END=B2+220;               // 1340
var DRIP_AMBIENT=B2+500;             // 1620 — first hint of pink appears
var DRIP_0_START=B2+630;             // 1750 — first drip begins
var DRIP_HOLD =B2+3200;              // drips full; hold
var SCENE_OUT =B2+4000;              // ball scene fades out
var SPLASH_IN =B2+4350;              // full screen in
var SPLASH_HOLD=B2+5250;             // full screen hold
var SPLASH_OUT =B2+5950;             // full screen fades out
var FADE_END  =B2+6200;              // 7320 - end

var t0=null,rafId=null;

function frame(ts){
  if(!t0)t0=ts;
  var now=ts-t0;
  if(!loaded()&&now<3000){rafId=requestAnimationFrame(frame);return;}

  ctx.clearRect(0,0,W,H);

  // background vignette
  var bg=ctx.createRadialGradient(CX,CY*0.75,0,CX,CY*0.75,Math.max(W,H)*0.80);
  bg.addColorStop(0,"#10121a");bg.addColorStop(1,NAVY);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // pink ambient glow (builds slowly as drips form)
  var ambT=rn(now,DRIP_AMBIENT,DRIP_AMBIENT+2400);
  if(ambT>0){
    var ag=ctx.createRadialGradient(CX,CY+R*0.5,0,CX,CY+R*0.5,W*0.72);
    ag.addColorStop(0,"rgba(224,0,106,"+(0.09*eo2(ambT)).toFixed(3)+")");
    ag.addColorStop(1,"rgba(224,0,106,0)");
    ctx.fillStyle=ag;ctx.fillRect(0,0,W,H);
  }

  // ── ball cycle ──────────────────────────────────────────────────────
  if(now<B2){
    var into,idx,q,sx,face;
    if(now<B0){
      // ball 0 (basketball)
      into=now;
      if(into<SHOW0){
        var st0=into<200?(1-into/200):0;
        drawBall(0,1+0.13*st0*st0);
      } else {
        q=(into-SHOW0)/FLIP;sx=Math.abs(Math.cos(q*Math.PI));
        face=q<0.5?0:1;if(face<3)drawBall(face,sx);
      }
    } else {
      // ball 1 (soccer)
      into=now-B0;
      var SHOW1=380;
      if(into<SHOW1){
        var st1=into<200?(1-into/200):0;
        drawBall(1,1+0.13*st1*st1);
      } else {
        q=(into-SHOW1)/FLIP;sx=Math.abs(Math.cos(q*Math.PI));
        face=q<0.5?1:2;if(face<3)drawBall(face,sx);
      }
    }
  } else {
    // ── Hero ball (volleyball) — holds and drips ─────────────────────
    var settleT=rn(now,B2,B2+220);
    var squash=settleT<1?(1-settleT):0, sq=squash*squash;
    drawBall(2,1+0.12*sq); // squash settle on arrival

    // coating alpha builds as drips develop
    var coatT=rn(now,DRIP_AMBIENT,DRIP_AMBIENT+2000);
    drawCoating(eo2(coatT)*0.52);
    if(coatT>0.02){var px=CX,py=CY-R*0.90,pr=R*0.28*eo2(coatT);ctx.save();var pg=ctx.createRadialGradient(px,py,0,px,py,pr*1.6);pg.addColorStop(0,"rgba(255,115,185,"+eo2(coatT)+")");pg.addColorStop(0.5,"rgba(232,0,106,"+(eo2(coatT)*0.70)+")");pg.addColorStop(1,"rgba(224,0,106,0)");ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,pr*1.6,0,Math.PI*2);ctx.fill();ctx.restore();}

    // ── drips ─────────────────────────────────────────────────────────
    DRIP_DATA.forEach(function(d){
      var dStart=DRIP_0_START+(d.startMs-1750);
      var growT=rn(now,dStart,dStart+d.growMs);
      if(growT<=0)return;

      // anchor point on ball surface
      var ax=CX+d.ax*R, ay=CY+d.ay*R;

      // current length: ease-out growth, slight overshoot then settle
      var lenFrac=eo3(growT);
      var curLen=d.maxLen*lenFrac;

      // anchor pool (tiny pink bleed where drip meets ball)
      drawAnchorPool(ax,ay,d.halfW,eo2(growT)*0.85);

      // draw the pendant drip
      // alpha: fade in quickly, stay at 1
      var dAlpha=eo2(rn(now,dStart,dStart+250));
      drawDrip(ax,ay,curLen,d.halfW,dAlpha);

      // falling detached drop (after drip reaches ~75% and starts necking)
      var dropPhase=rn(now,dStart+d.growMs*d.dropsAt,dStart+d.growMs*d.dropsAt+600);
      if(dropPhase>0&&dropPhase<1){
        var dropY=ay+curLen+dropPhase*R*0.65;
        var dropR=d.halfW*0.60*(1-dropPhase*0.3);
        ctx.beginPath();ctx.arc(ax,dropY,dropR,0,Math.PI*2);
        var dg=ctx.createRadialGradient(ax-dropR*0.25,dropY-dropR*0.25,0,ax,dropY,dropR);
        dg.addColorStop(0,PINK2);dg.addColorStop(1,"rgba(200,0,80,0.75)");
        ctx.globalAlpha=eo2(1-dropPhase);
        ctx.fillStyle=dg;ctx.fill();
        ctx.globalAlpha=1;
      }
    });

    // ball scene fades out
    if(now>DRIP_HOLD){var fo=eo2(rn(now,DRIP_HOLD,SCENE_OUT));ctx.fillStyle="rgba(7,8,14,"+fo.toFixed(3)+")";ctx.fillRect(0,0,W,H);}
  }
  // full-screen payoff
  if(now>SPLASH_IN){var sa=eo2(rn(now,SPLASH_IN,SPLASH_IN+750));var sf=1-eo2(rn(now,SPLASH_HOLD,SPLASH_OUT));drawFinalScreen(sa*sf);}

  if(now<FADE_END){rafId=requestAnimationFrame(frame);}
  else{
    ctx.fillStyle=NAVY;ctx.fillRect(0,0,W,H);
    if(window.parent!==window){
      // embedded as site overlay — signal parent and hide
      try{sessionStorage.setItem('po_oct_2026','1');}catch(e){}
      window.parent.postMessage('po-done','*');
      return;
    }
    ctx.textAlign="center";ctx.fillStyle="rgba(255,255,255,0.22)";
    ctx.font="700 12px \"Barlow Condensed\",system-ui";
    ctx.fillText("PRESS REPLAY",CX,CY);
  }
}

function replay(){if(rafId)cancelAnimationFrame(rafId);t0=null;rafId=requestAnimationFrame(frame);}
document.getElementById("btn").addEventListener("click",replay);
replay();
})();
</script>
